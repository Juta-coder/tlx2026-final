<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Final Chapter · Pre-work · TLX Roundtable 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#201060;--cyan:#00B0F0;--blue:#1466C7;--wash:#D6EEFB;--paper:#F4F7FC;--ink2:#4A5578;--line:#DCE3EF;--ok:#0E7A55;--warn:#B4441B;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;background:var(--paper);color:var(--navy);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.hero{background:var(--navy);color:#fff;padding:calc(34px + env(safe-area-inset-top,0px)) 22px 70px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:250px;background:var(--cyan);opacity:.18;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hero .k{font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:500}
.hero h1{font-size:34px;line-height:1.15;margin:8px 0 6px;font-weight:700}
.hero p{margin:0;opacity:.85;max-width:420px}
.wrap{max-width:560px;margin:-44px auto 0;padding:0 16px 60px;position:relative}
.card{background:#fff;border-radius:20px;padding:24px 22px;box-shadow:0 10px 30px rgba(32,16,96,.08)}
.steps{display:flex;align-items:center;margin:2px 4px 22px}
.steps .d{width:16px;height:16px;border-radius:50%;background:var(--line);flex:none;transition:background .3s,transform .3s}
.steps .d.on{background:var(--navy)}
.steps .d.now{background:var(--cyan);transform:scale(1.35)}
.steps .l{flex:1;height:4px;background:var(--line);margin:0 4px;border-radius:2px}
.steps .l.on{background:var(--navy)}
.qn{font-size:13px;letter-spacing:2px;color:var(--blue);font-weight:600}
h2{font-size:23px;line-height:1.35;margin:4px 0 6px}
.hint{color:var(--ink2);font-size:15px;margin:0 0 14px}
label{display:block;font-weight:500;margin:14px 0 6px}
input[type=text],input[type=email],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;min-height:48px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;margin-top:20px}
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:600;background:var(--navy);color:#fff;min-height:50px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.cyan{background:var(--cyan);color:#06122B}
.btn:disabled{opacity:.45;cursor:default}
.grow{flex:1}
.err{color:var(--warn);font-size:14px;margin-top:8px;min-height:1em}
.sum{background:var(--navy);color:#fff;border-radius:20px;padding:24px 22px;margin-bottom:18px}
.sum .k{font-size:12px;letter-spacing:3px;color:var(--cyan)}
.sum h3{font-size:24px;margin:6px 0 2px}
.sum .who{opacity:.8;font-size:15px;margin-bottom:8px}
.sum .it{border-top:1px solid rgba(255,255,255,.18);padding:14px 0 4px}
.sum .it b{display:block;font-size:13px;color:var(--cyan);font-weight:500;letter-spacing:.5px}
.sum .it p{margin:4px 0 0;white-space:pre-wrap}
.notice{border:2px solid var(--cyan);background:var(--wash);border-radius:16px;padding:18px 18px 20px}
.notice strong{display:block;font-size:18px;margin-bottom:4px}
.done{color:var(--ok);font-weight:600;margin-top:12px}
.cfg{background:#FFF4EC;border:1px solid #F3C4A8;color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="k">TLX ROUNDTABLE 2026 · THE FINAL CHAPTER</div>
  <h1>ก่อนบทสุดท้าย<br>มองย้อนการเดินทางของคุณ</h1>
  <p>3 คำถาม ใช้เวลาประมาณ 10 นาที คำตอบจะกลับมาช่วยคุณใน Session สุดท้าย</p>
</header>
<main class="wrap"><div class="card" id="app"></div></main>
<script>
/* ===== ใส่ URL ของ Apps Script Web App ตรงนี้ ===== */
const API = 'https://script.google.com/macros/s/AKfycby0jJQCs7uIEsdBf6Pom0ndScoU9-uTLLKTwClXe-_Uy-eU0dFntzbSAgHBGVfTzxIU/exec';

const KEY = 'tlx2026_prework';
const S = Object.assign({ step: 0, name: '', skill: '', knowledge: '', other: '', moment: '', next: '', id: '', email: '', sent: false }, JSON.parse(localStorage.getItem(KEY) || '{}'));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = t => String(t || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
let busy = false, err = '';

async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}

function steps() {
  const n = Math.min(S.step, 4);
  let h = '<div class="steps" aria-hidden="true">';
  for (let i = 0; i < 4; i++) {
    h += `<span class="d ${i < n ? 'on' : ''} ${i === n ? 'now' : ''}"></span>`;
    if (i < 3) h += `<span class="l ${i < n ? 'on' : ''}"></span>`;
  }
  return h + '</div>';
}

function render() {
  let h = API.startsWith('PASTE') ? '<div class="cfg">ยังไม่ได้ใส่ URL ของ Apps Script ในไฟล์นี้ (ตัวแปร API)</div>' : '';
  if (S.step < 4) h += steps();
  if (S.step === 0) {
    h += `<div class="qn">เริ่มต้น</div><h2>ชื่อของคุณ</h2>
    <label for="name">ชื่อ–นามสกุล</label><input type="text" id="name" data-k="name" value="${esc(S.name)}" autocomplete="name">
    <div class="row"><span class="grow"></span><button class="btn" data-go="1" ${S.name.trim() ? '' : 'disabled'}>เริ่ม</button></div>`;
  } else if (S.step === 1) {
    h += `<div class="qn">คำถามที่ 1 จาก 3</div><h2>ตอนมกราคม 2569 คุณตั้งใจว่าปีนี้ต้อง Focus เรื่องอะไรบ้าง</h2>
    <p class="hint">กรุณาตอบทุกช่อง</p>
    <label for="skill">ทักษะ — ทักษะอะไร</label><textarea id="skill" data-k="skill">${esc(S.skill)}</textarea>
    <label for="knowledge">ความรู้ — ความรู้ในเรื่องไหน</label><textarea id="knowledge" data-k="knowledge">${esc(S.knowledge)}</textarea>
    <label for="other">ประเด็นอื่นๆ</label><textarea id="other" data-k="other">${esc(S.other)}</textarea>
    <div class="row"><button class="btn ghost" data-go="0">ย้อน</button><span class="grow"></span><button class="btn" data-go="2" ${S.skill.trim() && S.knowledge.trim() && S.other.trim() ? '' : 'disabled'}>ถัดไป</button></div>`;
  } else if (S.step === 2) {
    h += `<div class="qn">คำถามที่ 2 จาก 3</div><h2>Key Moment ที่ทำให้คุณได้เรียนรู้และเติบโตในปี 2026 คืออะไร</h2>
    <p class="hint">เล่าเหตุการณ์ 1 เรื่อง เกิดอะไรขึ้น และคุณได้เรียนรู้อะไรจากมัน</p>
    <label for="moment">Key Moment ของฉัน</label><textarea id="moment" data-k="moment" style="min-height:160px">${esc(S.moment)}</textarea>
    <div class="row"><button class="btn ghost" data-go="1">ย้อน</button><span class="grow"></span><button class="btn" data-go="3" ${S.moment.trim() ? '' : 'disabled'}>ถัดไป</button></div>`;
  } else if (S.step === 3) {
    h += `<div class="qn">คำถามที่ 3 จาก 3</div><h2>ตอนนี้ Next Step ที่คุณตั้งเป้าไว้ หรือตั้งใจจะไปให้ถึง คืออะไร</h2>
    <p class="hint">Career Aspiration ของคุณ เช่น ตำแหน่ง บทบาท หรือขอบเขตงานที่อยากไปให้ถึง</p>
    <label for="next">Next Step ของฉัน</label><textarea id="next" data-k="next" style="min-height:140px">${esc(S.next)}</textarea>
    <div class="err">${esc(err)}</div>
    <div class="row"><button class="btn ghost" data-go="2">ย้อน</button><span class="grow"></span><button class="btn" data-submit ${S.next.trim() && !busy ? '' : 'disabled'}>${busy ? 'กำลังบันทึก…' : 'ดูสรุปของฉัน'}</button></div>`;
  } else {
    h += `<div class="sum"><div class="k">MY 2026 REFLECTION</div><h3>การเดินทางของฉัน</h3><div class="who">${esc(S.name)}</div>
    <div class="it"><b>ตอนมกราคม 2569 ฉันตั้งใจ Focus</b>${S.skill ? `<p>ทักษะ: ${esc(S.skill)}</p>` : ''}${S.knowledge ? `<p>ความรู้: ${esc(S.knowledge)}</p>` : ''}${S.other ? `<p>อื่นๆ: ${esc(S.other)}</p>` : ''}</div>
    <div class="it"><b>Key Moment ที่ทำให้ฉันเติบโต</b><p>${esc(S.moment)}</p></div>
    <div class="it"><b>Next Step · Career Aspiration</b><p>${esc(S.next)}</p></div></div>
    <div class="notice"><strong>📩 กรุณาส่งผลสรุปนี้เข้าเมลของคุณ</strong>
    <p style="margin:0 0 6px;color:var(--ink2);font-size:15px">คุณจะใช้คำตอบนี้เป็น input ใน Session สุดท้าย</p>
    <label for="email">อีเมลของคุณ</label><input type="email" id="email" data-k="email" value="${esc(S.email)}" autocomplete="email" placeholder="name@company.com">
    <div class="err">${esc(err)}</div>
    <div class="row" style="margin-top:8px"><button class="btn cyan" data-mail ${busy ? 'disabled' : ''}>${busy ? 'กำลังส่ง…' : S.sent ? 'ส่งอีกครั้ง' : 'ส่งผลเข้าเมล'}</button></div>
    ${S.sent ? `<div class="done">✓ ส่งแล้ว ตรวจกล่องจดหมาย ${esc(S.email)}</div>` : ''}</div>
    <div class="row"><button class="btn ghost" data-edit>แก้คำตอบ</button></div>`;
  }
  const a = document.activeElement, fid = a && a.id;
  $('#app').innerHTML = h;
  if (fid && document.getElementById(fid)) document.getElementById(fid).focus();
}

document.addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  S[k] = e.target.value; save();
  const btn = document.querySelector('[data-go]:not(.ghost),[data-submit]');
  if (btn) {
    const ok = S.step === 0 ? S.name.trim() : S.step === 1 ? (S.skill.trim() && S.knowledge.trim() && S.other.trim()) : S.step === 2 ? S.moment.trim() : S.step === 3 ? S.next.trim() : true;
    btn.disabled = !ok || busy;
  }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  err = '';
  if (b.dataset.go !== undefined) { S.step = +b.dataset.go; save(); render(); window.scrollTo(0, 0); }
  else if (b.hasAttribute('data-edit')) { S.step = 1; S.id = ''; S.sent = false; save(); render(); }
  else if (b.hasAttribute('data-submit')) {
    busy = true; render();
    try {
      const r = await post({ a: 'prework', name: S.name, skill: S.skill, knowledge: S.knowledge, other: S.other, moment: S.moment, next: S.next });
      if (!r.ok) throw new Error(r.error || 'save');
      S.id = r.id; S.step = 4; save();
    } catch (x) { err = 'บันทึกไม่สำเร็จ: ' + (x.message || x); }
    busy = false; render(); window.scrollTo(0, 0);
  }
  else if (b.hasAttribute('data-mail')) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim())) { err = 'กรุณาใส่อีเมลให้ถูกต้อง'; render(); return; }
    busy = true; render();
    try {
      const r = await post({ a: 'mail', id: S.id, email: S.email.trim() });
      if (!r.ok) throw new Error(r.error || 'mail');
      S.sent = true; save();
    } catch (x) { err = 'ส่งเมลไม่สำเร็จ: ' + (x.message || x); }
    busy = false; render();
  }
});

render();
</script>
</body>
</html>
