<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TLX Roundtable 2026 · The Final Chapter · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#201060;--cyan:#00B0F0;--blue:#1466C7;--wash:#D6EEFB;--paper:#F4F7FC;--ink2:#4A5578;--line:#DCE3EF;--gold:#F3D27A;--ok:#0E7A55;--warn:#B4441B;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;background:var(--paper);color:var(--navy);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:background .8s,color .8s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 110px}
.screen .wrap{max-width:1600px;padding:28px 44px 130px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.logo{display:inline-flex;background:#fff;border-radius:12px;padding:5px 9px;box-shadow:0 6px 16px rgba(32,16,96,.12)}
.logo img{display:block;height:34px;width:auto}
.screen .logo img{height:52px}
.brand{font-size:12px;letter-spacing:3px;font-weight:600;color:var(--blue)}
.mechip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-size:14px}
.mechip i{font-style:normal;font-size:22px}
h1{font-size:28px;line-height:1.25;margin:0 0 10px}
.screen h1{font-size:clamp(36px,3.4vw,60px)}
h2{font-size:21px;margin:0 0 8px}
.muted{color:var(--ink2)}
.small{font-size:14px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 26px rgba(32,16,96,.07);margin-bottom:16px}
label{display:block;font-weight:500;margin:12px 0 6px}
input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;min-height:48px}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;background:var(--navy);color:#fff;min-height:48px}
.btn.alt{background:transparent;color:inherit;border:1.5px solid var(--line)}
.btn.cyan{background:var(--cyan);color:#06122B}
.btn.gold{background:var(--gold);color:#1B0F3F}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.saved{color:var(--ok);font-size:14px;font-weight:500}
.en{display:block;font-size:.8em;font-weight:400;opacity:.72;line-height:1.35}
h1 .en,.stmt .en{font-size:.6em;margin-top:4px}
.cfg{background:#FFF4EC;border:1px solid #F3C4A8;color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}

/* icons */
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.icons button{aspect-ratio:1;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:26px;display:grid;place-items:center}
.icons button[aria-pressed="true"]{border-color:var(--cyan);background:var(--wash);transform:scale(1.06)}
.icons button:disabled{opacity:.25}

/* phone scale (dots + line) */
.qtag{font-size:13px;letter-spacing:2px;font-weight:600;color:var(--blue)}
.stmt{font-size:24px;font-weight:600;line-height:1.35;margin:6px 0 2px}
.stmt-en{color:var(--ink2);font-size:15px;margin-bottom:8px}
.pscale{position:relative;margin:70px 0 6px;height:60px}
.pscale .ln{position:absolute;left:12.5%;right:12.5%;top:26px;height:5px;background:var(--navy);border-radius:3px}
.pscale .dots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
.pscale .dots button{justify-self:center;width:56px;height:56px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.pscale .dots button span{width:28px;height:28px;border-radius:50%;background:var(--navy);display:block;transition:transform .25s,background .25s}
.pscale .dots button[aria-pressed="true"] span{background:var(--cyan);transform:scale(1.25)}
.pscale .token{position:absolute;top:-58px;transform:translateX(-50%);transition:left .55s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;white-space:nowrap}
.pscale .token i{font-style:normal;font-size:32px;line-height:1}
.plabels{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:13px;font-weight:600;line-height:1.3}
.plabels small{display:block;font-weight:400;color:var(--ink2);font-size:12px}

/* big screen scale */
.board{margin-top:22px}
.bhead{position:relative;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.bhead::before{content:"";position:absolute;left:12.5%;right:12.5%;top:22px;height:6px;background:var(--navy);border-radius:3px}
.bhead div{position:relative}
.bhead .dot{width:50px;height:50px;border-radius:50%;background:var(--navy);margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;border:6px solid var(--paper)}
.bhead b{display:block;font-size:24px}
.bhead small{color:var(--ink2);font-size:16px}
.bhead .cnt{font-size:16px;color:var(--blue);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px;min-height:300px}
.col{background:#fff;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--wash);border-radius:999px;padding:4px 12px 4px 6px;font-size:15px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip i{font-style:normal;font-size:24px;line-height:1}
.pending{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pending .chip{background:transparent;border:1.5px dashed var(--line);opacity:.7}
.grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:start}
#qr{background:#fff;padding:18px;border-radius:18px;display:inline-block}
.big{font-size:clamp(48px,5vw,88px);font-weight:700;line-height:1}

/* commit */
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:var(--wash)}
.opt small{display:block;color:var(--ink2)}
.wall{columns:3 320px;column-gap:16px;margin-top:18px}
.wall .v{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.wall .v .who{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:14px;margin-top:8px}
.myturn{background:var(--cyan);color:#06122B;border-radius:18px;padding:22px;text-align:center;margin-bottom:16px}
.myturn strong{display:block;font-size:30px}

/* wheel */
.wheelbox{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center}
.wheelwrap{position:relative;width:560px;height:560px}
.wheelwrap canvas{width:560px;height:560px;display:block}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:40px solid var(--gold);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.hub{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:#fff;border:6px solid var(--navy);display:grid;place-items:center;font-size:26px}
.picked{font-size:clamp(40px,4vw,72px);font-weight:700;line-height:1.1}

/* ===== Stardust night (Part 3 only) ===== */
body.night{background:linear-gradient(180deg,#010208 0%,#050A24 32%,#0E1440 55%,#2A2766 74%,#5B5A9E 88%,#8C8CC4 100%) fixed;color:#EEF0FF}
body.night .brand{color:#F3D27A}
body.night .card{background:rgba(10,14,40,.55);border:1px solid rgba(160,170,255,.28);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 20px 50px rgba(0,0,10,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.night input[type=text],body.night textarea{background:rgba(255,255,255,.07);border-color:rgba(180,190,255,.35);color:#fff}
body.night .muted{color:#B9BEE6}
body.night .mechip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
body.night .chip{background:rgba(255,255,255,.14);color:#fff}
body.night .saved{color:#9FF0CF}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1.2s;overflow:hidden}
body.night #sky{opacity:1}
#sky .st{position:absolute;border-radius:50%;background:#fff;animation:tw 3.4s ease-in-out infinite}
#sky .st.b{box-shadow:0 0 6px 2px rgba(255,255,255,.8),0 0 14px 4px rgba(150,170,255,.35)}
#sky .mw{position:absolute;left:-30vw;top:6vh;width:160vw;height:38vh;transform:rotate(-24deg);background:radial-gradient(ellipse at center,rgba(200,195,255,.22) 0%,rgba(140,130,230,.10) 35%,rgba(0,0,0,0) 70%);filter:blur(18px)}
#sky .shoot{position:absolute;right:8%;top:6%;width:340px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9));transform:rotate(-32deg);transform-origin:right center;animation:shoot 9s ease-in infinite;opacity:0}
#sky .shoot::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.9)}
#sky .shoot.s2{right:35%;top:2%;width:220px;animation-delay:4.5s}
#sky svg.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh;min-height:140px}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-32deg)}4%{opacity:1}14%{opacity:0;transform:translate(-520px,320px) rotate(-32deg)}100%{opacity:0}}
#app{position:relative;z-index:1}
.fairy-k{font-family:"Outfit","Prompt",sans-serif;font-size:14px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#F3D27A}
.fairy-t{font-family:"Outfit","Prompt",sans-serif;font-weight:800;font-size:32px;line-height:1.12;margin:8px 0 6px;color:#fff;letter-spacing:-.5px;text-shadow:0 0 24px rgba(150,170,255,.45)}
.screen .fairy-t{font-size:clamp(46px,4.8vw,86px)}
.fairy-th{font-family:"Prompt",sans-serif;font-weight:600;font-size:22px;color:#F3D27A;line-height:1.4}
.screen .fairy-th{font-size:clamp(26px,2.3vw,42px)}
.rules{border:1px solid rgba(243,210,122,.45);background:rgba(243,210,122,.08);border-radius:14px;padding:12px 14px;font-size:14px;color:#F8EBC4;margin:14px 0}
.screen .rules{font-size:22px;padding:16px 22px;display:inline-block}
.gift{background:linear-gradient(135deg,rgba(243,210,122,.22),rgba(110,120,255,.18));border:1px solid rgba(243,210,122,.55);border-radius:16px;padding:14px 16px;margin:10px 0 4px}
.gift .from{font-family:'Outfit','Prompt',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#F3D27A}

/* controls */
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.livedot i{width:9px;height:9px;border-radius:50%;background:#9AA3B5;display:block}
.livedot.on i{background:#16C47F;box-shadow:0 0 0 4px rgba(22,196,127,.2)}
body.night .livedot{color:#B9BEE6}
.toprt{display:flex;align-items:center;gap:12px}
.spot{background:#fff;border-radius:26px;padding:40px 48px;box-shadow:0 30px 70px rgba(32,16,96,.18);margin-top:20px;max-width:1100px}
.spot .who{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600}
.spot .who i{font-style:normal;font-size:56px}
.spot .lbl2{font-size:16px;letter-spacing:2px;color:var(--blue);font-weight:600;margin-top:22px}
.spot .wish{font-size:clamp(28px,2.6vw,44px);font-weight:700;line-height:1.3;margin-top:4px}
.spot .act{font-size:clamp(22px,2vw,34px);line-height:1.45;margin-top:4px;color:#2B2F4A}
.adminpanel{margin-top:22px;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adminpanel button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 8px;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.adminpanel button[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#06122B}
.qrlay{position:fixed;inset:0;z-index:9;background:rgba(244,247,252,.97);display:grid;place-items:center;text-align:center}
.qrlay #qr2{background:#fff;padding:22px;border-radius:22px;box-shadow:0 20px 50px rgba(32,16,96,.15);display:inline-block}
.mydone{background:linear-gradient(135deg,#00B0F0,#1466C7);color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:16px}
.mydone b{display:block;font-size:13px;letter-spacing:1.5px;opacity:.85;font-weight:600}
.mydone p{margin:4px 0 10px;font-size:18px}
.controls{position:fixed;left:0;right:0;bottom:0;background:#fff;color:var(--navy);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}
.controls .lbl{font-weight:600;padding:0 8px}
.controls input{width:150px;min-height:40px}
@media (max-width:700px){.lobby,.wheelbox{grid-template-columns:1fr}.wheelwrap,.wheelwrap canvas{width:320px;height:320px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="app"><div class="wrap"><p class="muted">กำลังเชื่อมต่อ… · Connecting…</p></div></div>
<script>
/* ===== ใส่ URL ของ Apps Script Web App ตรงนี้ ===== */
const API = 'https://script.google.com/macros/s/AKfycby0jJQCs7uIEsdBf6Pom0ndScoU9-uTLLKTwClXe-_Uy-eU0dFntzbSAgHBGVfTzxIU/exec';

const Q = [
  { th: 'ทีมกล้าบอกฉันเมื่อฉันผิด', en: 'My team feels safe to tell me when I’m wrong.' },
  { th: 'ฉันพัฒนาคนในทีม มากกว่าแก้ปัญหาแทนเขา', en: 'I develop my people rather than solve problems for them.' },
  { th: 'ฉันขอ feedback เรื่องการนำทีมของตัวเอง', en: 'I ask for feedback on how I lead.' },
  { th: 'ฉันยอมรับความผิดพลาดต่อหน้าทีม', en: 'I admit my mistakes openly to my team.' },
  { th: 'ฉันให้เวลากับการเรียนรู้สิ่งใหม่เพื่อเติบโต', en: 'I make time to learn something new for my growth.' },
  { th: 'ฉันกล้าออกจาก comfort zone เพื่อลองสิ่งที่ไม่เคยทำ', en: 'I step out of my comfort zone to try things I’ve never done.' }
];
const SC = [['Never', 'ไม่เคย'], ['Sometimes', 'บางครั้ง'], ['Frequently', 'บ่อยครั้ง'], ['Always', 'เสมอ']];
const ICONS = ['🦁','🐯','🦊','🐼','🐨','🐸','🐵','🦉','🦄','🐬','🐳','🦋','🐝','🐢','🦕','🐙','🦩','🐧','🐻','🐰','🐶','🐱','🦒','🦓','🐘','🦔','🌻','🌵','🚀','⭐','🍀','🌈','🎈','🎸','🍉','⚡'];
const STEPS = [{ stage: 'lobby', label: 'เข้าห้อง · Lobby' }]
  .concat(Q.map((q, i) => ({ stage: 'scale', q: i, label: 'คำถาม · Q' + (i + 1) })))
  .concat([{ stage: 'wish', label: 'พร 3 ข้อ · 3 Wishes' }, { stage: 'commit', label: 'Commitment' }, { stage: 'wheel', label: 'วงล้อ · Wheel' }, { stage: 'end', label: 'ปิด · Close' }]);

const view = () => location.hash.slice(1) === 'screen' ? 'screen' : 'me';
const S = { st: { stage: 'lobby', q: 0 }, players: [], me: null, loaded: false, pid: localStorage.getItem('tlx2026_pid') || '', key: localStorage.getItem('tlx2026_key') || '', admin: false, drafts: {}, err: '', busy: false, pick: null, spinning: false };
const $ = s => document.querySelector(s);

/* ---------- network ---------- */
async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
let lastSig = '';
let polling = false, seq = 0, applied = 0;
async function poll(force) {
  if (API.startsWith('PASTE')) { S.loaded = true; render(); return; }
  if (polling && !force) return;
  polling = true; const my = ++seq;
  try {
    const r = await fetch(API + '?a=state&pid=' + encodeURIComponent(S.pid) + '&t=' + Date.now());
    const d = await r.json();
    if (d.error) { S.netErr = 'Server error / หลังบ้านตอบกลับว่า: ' + d.error; S.loaded = true; render(); return; }
    if (my < applied) return; applied = my;
    S.netErr = ''; S.lastOk = Date.now();
    S.st = d.state || S.st; S.players = d.players || []; S.me = d.me; S.loaded = true;
    const sig = JSON.stringify([d.state, d.players, d.me]);
    if (force || sig !== lastSig) { lastSig = sig; render(); }
  } catch (e) { S.netErr = 'เชื่อมต่อไม่ได้ · Cannot connect (' + (e.message || e) + ')'; S.loaded = true; render(); }
  finally { polling = false; }
}
const admin = (op, extra) => post(Object.assign({ a: 'admin', key: S.key, op }, extra || {}));

/* ---------- wheel ---------- */
let wheelRot = 0;
function wheelCandidates() {
  const spoken = S.st.spoken || [];
  const left = S.players.filter(p => !spoken.includes(p.id));
  return left.length ? left : S.players;
}
function drawWheel() {
  const cv = $('#wheel'); if (!cv) return;
  const ctx = cv.getContext('2d'), N = wheelCandidates(), n = N.length, R = 540, cx = 560, cy = 560;
  ctx.clearRect(0, 0, 1120, 1120);
  if (!n) return;
  const cols = ['#201060', '#00B0F0', '#1466C7', '#7FD6F7', '#F3D27A', '#3B2A86'];
  const dark = ['#201060', '#1466C7', '#3B2A86'];
  const seg = 2 * Math.PI / n;
  N.forEach((p, i) => {
    const a0 = wheelRot + i * seg - Math.PI / 2;
    const col = cols[i % cols.length] === cols[0] && i === n - 1 && n % cols.length === 1 ? cols[2] : cols[i % cols.length];
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + seg); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + seg / 2); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = dark.includes(col) ? '#fff' : '#201060';
    const fs = Math.max(20, Math.min(40, 900 / n)); ctx.font = `600 ${fs}px Prompt, sans-serif`;
    const label = (p.icon + ' ' + p.name).slice(0, 18); ctx.fillText(label, R - 26, 0); ctx.restore();
  });
}
function spin() {
  const N = wheelCandidates(); if (!N.length || S.spinning) return;
  S.spinning = true; render();
  const n = N.length, idx = Math.floor(Math.random() * n), seg = 2 * Math.PI / n;
  const target = -(idx * seg + seg / 2);
  let delta = ((target - wheelRot) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  const start = wheelRot, end = wheelRot + delta + 2 * Math.PI * 6, T = 5200, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - k, 4);
    wheelRot = start + (end - start) * e; drawWheel();
    if (k < 1) requestAnimationFrame(step);
    else { const id = N[idx].id; wheelRot = wheelRot % (2 * Math.PI); S.spinning = false; S.st.wheel = { id, at: Date.now() }; S.st.spoken = (S.st.spoken || []).concat([id]); render(); admin('spin', { id }).then(() => poll(true)); wheelRot = 0; }
  };
  requestAnimationFrame(step);
}

/* ---------- render ---------- */
function render() {
  const v = view();
  document.body.classList.toggle('screen', v === 'screen');
  document.body.classList.toggle('night', S.st.stage === 'wish' && (v === 'screen' || !!S.me));
  if (S.spinning) return;
  const a = document.activeElement, fid = a && a.id, ss = a && a.selectionStart, se = a && a.selectionEnd;
  const before = {};
  if (v === 'screen') document.querySelectorAll('[data-chip]').forEach(el => before[el.dataset.chip] = el.getBoundingClientRect());
  $('#app').innerHTML = v === 'screen' ? screenView() : meView();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch (e) {} } }
  if (v === 'screen') {
    document.querySelectorAll('[data-chip]').forEach(el => {
      const b = before[el.dataset.chip]; if (!b) return;
      const r = el.getBoundingClientRect(), dx = b.left - r.left, dy = b.top - r.top;
      if (!dx && !dy) return;
      el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.3,1.2,.5,1)' });
    });
    const qr = $('#qr'); if (qr && window.QRCode) new QRCode(qr, { text: location.origin + location.pathname, width: 260, height: 260, colorDark: '#201060' });
    const qr2 = $('#qr2'); if (qr2 && window.QRCode) new QRCode(qr2, { text: location.origin + location.pathname, width: 380, height: 380, colorDark: '#201060' });
    drawWheel();
  }
}

  else if (b.hasAttribute('data-join')) {
    const name = (S.drafts.name || '').trim(), icon = S.drafts.icon;
    if (!name || !icon) { S.err = 'ใส่ชื่อและเลือก Icon ก่อน · Enter a name and pick an icon'; render(); return; }
    S.busy = true; render();
    try { const r = await post({ a: 'join', name, icon }); if (!r.ok) throw 0; S.pid = r.id; localStorage.setItem('tlx2026_pid', r.id); await poll(true); }
    catch (x) { S.err = 'เข้าร่วมไม่สำเร็จ ลองอีกครั้ง · Could not join, try again'; }
    S.busy = false; render();
  }
  else if (b.dataset.ans) {
    const q = S.st.q || 0, v = +b.dataset.ans;
    S.me.ans = Object.assign({}, S.me.ans, { [String(q)]: v }); render();
    post({ a: 'answer', pid: S.pid, q, v });
  }
  else if (b.hasAttribute('data-wish')) {
    const m = S.me, role = (S.drafts.role ?? m.role ?? '').trim(), wishes = [0, 1, 2].map(i => (S.drafts['w' + i] ?? (m.wishes || [])[i] ?? '').trim());
    if (!wishes.some(Boolean)) return;
    m.role = role; m.wishes = wishes; render();
    await post({ a: 'wish', pid: S.pid, role, wishes }); poll(true);
  }
  else if (b.hasAttribute('data-wish4')) {
    const text = (S.drafts.w4 ?? S.me.wish4 ?? '').trim(); if (!text) return;
    S.me.wish4 = text; render();
    await post({ a: 'wish4', pid: S.pid, text }); poll(true);
  }
  else if (b.dataset.show !== undefined) { S.st = Object.assign({}, S.st, { show: b.dataset.show }); render(); await admin('show', { id: b.dataset.show }); poll(true); }
  else if (b.hasAttribute('data-qr')) { S.qr = !S.qr; render(); }
  else if (b.hasAttribute('data-gift')) {
    const text = (S.drafts.gw || '').trim(); if (!text || !S.me.giveTo) return;
    S.me.giftSent = { to: S.me.giveTo, text }; render();
    await post({ a: 'gift', pid: S.pid, to: S.me.giveTo, text }); poll(true);
  }
  else if (b.dataset.opt !== undefined) {
    const m = S.me, opts = commitOpts(m).map(o => o.t);
    S.drafts.cw = opts[+b.dataset.opt] || ''; render();
  }
  else if (b.hasAttribute('data-commit')) {
    const c = S.me.commit || {}, wish = (S.drafts.cw ?? c.wish ?? '').trim(), action = (S.drafts.ca ?? c.action ?? '').trim();
    if (!wish || !action) return;
    S.me.commit = { wish, action }; render();
    await post({ a: 'commit', pid: S.pid, wish, action }); poll(true);
  }
  else if (b.hasAttribute('data-login')) {
    const key = (S.drafts.key || '').trim();
    const r = await post({ a: 'admin', key, op: 'ping' }).catch(() => ({}));
    if (r.ok) { S.key = key; S.admin = true; localStorage.setItem('tlx2026_key', key); } else S.err = 'Admin key ไม่ถูกต้อง · Wrong admin key';
    render();
  }
  else if (b.dataset.step !== undefined) {
    const s = STEPS[+b.dataset.step]; if (!s) return;
    S.st = Object.assign({}, S.st, { stage: s.stage, q: s.q || 0 }); render();
    await admin('stage', { stage: s.stage, q: s.q || 0 }); poll(true);
  }
  else if (b.hasAttribute('data-pair')) { await admin('pair'); poll(true); }
  else if (b.hasAttribute('data-spin')) spin();
  else if (b.hasAttribute('data-export')) { const r = await admin('export'); S.err = r.ok ? `Exported ${r.rows} · Export แล้ว` : 'Export failed · ไม่สำเร็จ'; render(); }
  else if (b.hasAttribute('data-reset')) { if (confirm('ลบผู้เล่นและคำตอบทั้งหมด แล้วกลับไปเริ่มใหม่? (ใช้หลังซ้อม)\nDelete all players and answers and start over? (after rehearsal only)')) { await admin('reset'); poll(true); } }
});

window.addEventListener('hashchange', () => render());
(async function boot() {
  if (S.key && view() === 'screen') { const r = await post({ a: 'admin', key: S.key, op: 'ping' }).catch(() => ({})); S.admin = !!r.ok; }
  await poll(true);
  setInterval(() => { if (!S.spinning) poll(); }, 2000);
  const wake = () => { if (!document.hidden && !S.spinning) poll(true); };
  document.addEventListener('visibilitychange', wake); window.addEventListener('focus', wake); window.addEventListener('pageshow', wake); window.addEventListener('online', wake);
  setInterval(() => { const d = document.getElementById('livedot'); if (d) d.classList.toggle('on', Date.now() - (S.lastOk || 0) < 7000); }, 1000);
})();
</script>
</body>
</html>
